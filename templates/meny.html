{% extends "base.html" %}

{% block content %}
    <h1 class="meny_tittel">Ukens meny</h1>

    <div class="meny-container">
        {% for rett in ukesmeny %}
            <div class="retter">
                <h2>{{ rett.dag }}</h2>
                <img src="{{ rett.bilde }}" alt="{{ rett.navn }}">
                <h3>{{ rett.navn }}</h3>
                <p>{{ rett.pris }} kr</p>
            </div>
        {% endfor %}
    </div>
{% endblock %}
